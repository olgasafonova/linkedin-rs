version: 2
updates:
  # Rust crate dependencies (workspace manifest lives at /linkedin)
  - package-ecosystem: "cargo"
    directory: "/linkedin"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    reviewers:
      - "olgasafonova"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    reviewers:
      - "olgasafonova"
